# OZGPS default configuration.
# Copy this file to settings.properties before editing server-specific values.

# Logging level used by the plugin logger.
# Common values: ALL, INFO, WARNING, SEVERE, OFF
logLevel=ALL

# Send a short plugin welcome message when a player joins.
# Example: sendPluginWelcome=true
sendPluginWelcome=false

# Marker categories shown in the GPS menu and grid.
# Disable a category here to hide it completely from regular GPS workflows.
enablePrivateMarkers=true
enableGroupMarkers=true
enableGlobalMarkers=true
enableStaticMarkers=true

# Static GPS Configuration
# These switches control which static teleport targets can be used.
# Backport uses the player's last position before a GPS teleport.
# Deathport uses the player's last known death position during the current session.
enableBackport=true
enableDeathport=true
enableDefaultSpawn=true
enablePrimarySpawn=true
enableSecondarySpawn=true
enableTertiarySpawn=true
enableQuaternarySpawn=true

# Discord Connect Integration
# Discord forwarding is optional. Leave channel IDs at 0 to use the Discord
# Connect plugin default behavior, or set a concrete Discord channel ID.
# Example: enableDiscordGlobalGPSEvents=true
# Example: discordGlobalGPSChannelId=123456789012345678
enableDiscordStaticGPSEvents=false
enableDiscordPrivateGPSEvents=false
enableDiscordGroupGPSEvents=false
enableDiscordGlobalGPSEvents=false
discordStaticGPSChannelId=0
discordPrivateGPSChannelId=0
discordGroupGPSChannelId=0
discordGlobalGPSChannelId=0
discordGPSIncludeMarkerPosition=true
discordGPSIncludeMarkerName=true


# Marker limits.
# -1 means unlimited. Positive values will be used once marker limit handling is implemented.
# Example: maxPrivateMarkers=25
maxPrivateMarkers=-1
maxGroupMarkers=-1

# Teleport cooldowns in seconds.
# A value of 0 disables the cooldown and hides the cooldown status UI for that marker type.
# Defaults:
#   static markers: 10 seconds
#   group markers: 30 seconds
#   private markers: 60 seconds
#   global markers: 300 seconds
# Example: disable private marker cooldowns with usePrivateMarkerCooldownSeconds=0
# Example: make global teleports wait 10 minutes with useGlobalMarkerCooldownSeconds=600
useStaticMarkerCooldownSeconds=10
usePrivateMarkerCooldownSeconds=60
useGroupMarkerCooldownSeconds=30
useGlobalMarkerCooldownSeconds=300

# Not yet implemented
# Future wallet/economy integration placeholders. These values are read by settings
# loading today, but no cost is charged yet.
# Example future use: useGlobalMarkerCost=250
createPrivateMarkerCost=100
createGroupMarkerCost=100
useStaticMarkerCost=10
usePrivateMarkerCost=10
useGroupMarkerCost=10
useGlobalMarkerCost=10
